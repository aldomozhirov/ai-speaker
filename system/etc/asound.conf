# System-wide ALSA route for the smart speaker.
# Applications play to `smartspk` (or to ALSA `default`).
# CamillaDSP captures the other side of snd-aloop and is the only process
# that should play to the physical HiFiBerry PCM.

defaults.pcm.rate_converter "speexrate_best"

pcm.smartspk_dmix {
    type dmix
    ipc_key 24680
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        format S32_LE
        rate 48000
        channels 2
        period_time 0
        period_size 512
        buffer_size 2048
    }
    bindings {
        0 0
        1 1
    }
}

pcm.smartspk {
    type plug
    slave.pcm "smartspk_dmix"
    # Duplicates a one-channel TTS stream into L and R before the safe mono sum.
    route_policy duplicate
    hint {
        show on
        description "Smart speaker DSP input (48 kHz, multi-client)"
    }
}

pcm.!default {
    type plug
    slave.pcm "smartspk_dmix"
    route_policy duplicate
}

# Change the card identifier if `aplay -l` reports something different.
ctl.!default {
    type hw
    card sndrpihifiberry
}
