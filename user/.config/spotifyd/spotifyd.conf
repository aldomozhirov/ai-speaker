[global]

# Stable device name shown to Spotify clients.
device_name = "AI Speaker"
device_type = "speaker"

# Spotify Connect discovery and local MPRIS control.
use_mpris = true
dbus_type = "session"

# Join the existing PipeWire-Pulse default sink. Do not open ALSA directly;
# CamillaDSP must remain the only process that owns the HiFiBerry device.
backend = "pulseaudio"
bitrate = 320

# PipeWire is the single physical volume authority. The local volume bridge
# mirrors this value into spotifyd's MPRIS interface for Spotify Connect.
volume_controller = "none"
initial_volume = 100

cache_path = "/home/aldom/.cache/spotifyd"
no_audio_cache = false
autoplay = false

# Fires on every player event, not just song changes (misleading option name).
# Used here to play a chime when a client connects via Spotify Connect --
# see spotifyd-event-hook.sh for which PLAYER_EVENT that is and why.
on_song_change_hook = "/home/aldom/.local/bin/spotifyd-event-hook.sh"
