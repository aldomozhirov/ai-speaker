monitor.alsa.properties = {
  alsa.udev.expose-busy = true
}

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-snd_aloop.0.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ "FL", "FR" ]
        api.alsa.disable-mmap = true
        api.alsa.period-size = 1024
        api.alsa.period-num = 16
        session.suspend-timeout-seconds = 0
        priority.session = 1400
        # This sink has to be the clock master (graph driver) of everything
        # linked to it. By default it ties with the XVF3800's USB output at
        # 1009 and start-up order decides; after the reboot of 2026-10-04 the
        # XVF3800 won, PipeWire rate-matched this sink against snd-aloop's
        # coarse clock, the echo's delay wandered by 2 ms every ~25 s, and the
        # chip's echo canceller removed 0 dB instead of 28 dB. Above the
        # capture devices (2009) too, so a stream linking both cannot hand the
        # clock to the microphone either. Check with ai-speaker-status.sh.
        priority.driver = 2500
        # Shared with the XVF3800 sink below; see there.
        clock.name = "smartspk.program"
      }
    }
  }
  {
    # The XVF3800's playback input carries the echo canceller's reference
    # (xvf-aec-ref.service copies the program audio into it). The canceller
    # needs that reference to arrive a fixed time before the echo, to a
    # fraction of a millisecond; a drift of one sample a second is already
    # too much for it.
    #
    # clock.name: this sink runs as a follower of the loopback sink above, and
    # PipeWire would normally rate-match it, i.e. resample to hold its buffer
    # level. Here that only does harm. The graph's clock is snd-aloop's, and
    # the moment each cycle runs shifts by about a millisecond every 5-15 s.
    # The rate matching let that error build up and then corrected it in a
    # hurry, sliding the reference 2-3 ms within two seconds (measured
    # 2026-10-04 with tools/aec/aec-ref-timing-probe.py: 3 of 11 bursts
    # before the audio threads had realtime priority, 4 of 8 after, so not a
    # scheduling problem; 0 of 6 without rate matching), and the canceller lost
    # some 20 s each time. The speaker path is not resampled at all (CamillaDSP
    # paces the loopback instead), and the XVF3800 (USB, synchronous endpoints)
    # and the DAC run within about 3 ppm of each other. Giving both sinks the
    # same clock name tells PipeWire they share a clock, so it copies the
    # samples through unchanged and the shifting cycles only move this sink's
    # buffer level.
    #
    # api.alsa.headroom: room for that, and for a late cycle. The default left
    # 8 ms; this leaves 45 ms (PipeWire resynchronises only beyond 21 ms off
    # target, which 3 ppm takes about two hours of unbroken playback to reach).
    # The extra 37 ms of delay replaces the 40 ms that pw-loopback used to add
    # (XVF_AEC_REF_DELAY in xvf-aec-ref.service, now 0). Changing either moves
    # the reference in time: re-measure with
    #   aec-ref-timing-probe.py lead      (inaudible)
    #   aec-align-check.py                (audible, also says how much is cancelled)
    matches = [
      {
        node.name = "alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993700254500350-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        clock.name = "smartspk.program"
        api.alsa.headroom = 1792
      }
    }
  }
]
